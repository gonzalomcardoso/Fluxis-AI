name: fluxis-env-test

services:
  postgres_test:
    container_name: postgres-test
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-fluxis_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-fluxis_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env.test}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend_env_test:
    image: fluxis-ai-backend:env-test
    container_name: env-test
    restart: unless-stopped
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      APP_FRONTEND_URL: http://localhost:5174
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-local-development-only-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_test:5432/${POSTGRES_TEST_DB:-fluxis_test}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_TEST_USER:-fluxis_test}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env.test}
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_test_data:
    name: fluxis-ai_postgres_test_data
