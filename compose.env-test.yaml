services:
  backend_env_test:
    image: fluxis-ai-backend:env-test
    container_name: env-test
    restart: unless-stopped
    networks:
      - fluxis_test_network
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      APP_FRONTEND_URL: http://localhost:5174
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-local-development-only-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/fluxis_test
      SPRING_DATASOURCE_USERNAME: fluxis_test
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the main repository .env}
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  fluxis_test_network:
    external: true
    name: fluxis-ai_default
