services:
  postgres:
    container_name: postgres-dev
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DB:-fluxis_dev}
      POSTGRES_USER: ${POSTGRES_DEV_USER:-fluxis_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: fluxis-ai-backend:feat-d6
    container_name: backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-local-development-only-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DEV_DB:-fluxis_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_DEV_USER:-fluxis_dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres_prod:
    container_name: postgres-prod
    image: postgres:18
    profiles:
      - prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PROD_DB:-fluxis_prod}
      POSTGRES_USER: ${POSTGRES_PROD_USER:-fluxis_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD:?Set POSTGRES_PROD_PASSWORD in .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend_prod:
    image: fluxis-ai-backend:env-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: env-prod
    profiles:
      - prod
    restart: unless-stopped
    depends_on:
      postgres_prod:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      APP_FRONTEND_URL: ${APP_PROD_FRONTEND_URL:-http://localhost:5175}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_prod:5432/${POSTGRES_PROD_DB:-fluxis_prod}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PROD_USER:-fluxis_prod}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PROD_PASSWORD:?Set POSTGRES_PROD_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PROD_SERVER_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres_test:
    container_name: postgres-test
    image: postgres:18
    profiles:
      - test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-fluxis_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-fluxis_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend_test:
    image: fluxis-ai-backend:dev
    container_name: backend-test
    profiles:
      - test
    restart: unless-stopped
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      APP_FRONTEND_URL: http://localhost:5174
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-local-development-only-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_test:5432/${POSTGRES_TEST_DB:-fluxis_test}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_TEST_USER:-fluxis_test}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_dev_data:
  postgres_prod_data:
  postgres_test_data:
