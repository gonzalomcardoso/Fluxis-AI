name: fluxis-env-prod

services:
  postgres_prod:
    container_name: postgres-prod
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PROD_DB:-fluxis_prod}
      POSTGRES_USER: ${POSTGRES_PROD_USER:-fluxis_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD:?Set POSTGRES_PROD_PASSWORD in .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend_prod:
    image: fluxis-ai-backend:env-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: env-prod
    restart: unless-stopped
    depends_on:
      postgres_prod:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      APP_FRONTEND_URL: ${APP_PROD_FRONTEND_URL:-http://localhost:5175}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_prod:5432/${POSTGRES_PROD_DB:-fluxis_prod}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PROD_USER:-fluxis_prod}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PROD_PASSWORD:?Set POSTGRES_PROD_PASSWORD in .env.prod}
    ports:
      - "127.0.0.1:${PROD_SERVER_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_prod_data:
    name: fluxis-ai_postgres_prod_data
