spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.application.name=fluxis-ai

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:fluxis}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:fluxis}}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=${SERVER_PORT:8080}
