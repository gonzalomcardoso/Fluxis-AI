spring:
  application:
    name: fluxis-ai
  profiles:
    default: dev
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  gmail:
    token-encryption-key: ${APP_TOKEN_ENCRYPTION_KEY:}
    token-encryption-key-version: ${APP_TOKEN_ENCRYPTION_KEY_VERSION:1}
    oauth:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}
      scopes: ${GOOGLE_OAUTH_SCOPES:openid,email,https://www.googleapis.com/auth/gmail.metadata}
